<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dynamic Social Network Friend Analyzer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>
<body>
<nav class="navbar navbar-dark bg-primary shadow-sm">
  <div class="container-fluid px-4">
    <span class="navbar-brand fw-semibold"><i class="fa-solid fa-share-nodes me-2"></i>Dynamic Social Network Friend Analyzer</span>
    <span class="text-white-50 small">MS Computer Science • Dynamic Graphs</span>
  </div>
</nav>

<main class="container-fluid py-4 px-lg-4">
  <div id="alertBox"></div>
  <div class="row g-3 mb-3" id="stats"></div>

  <div class="row g-4">
    <div class="col-xl-3">
      <div class="card shadow-sm mb-3">
        <div class="card-header fw-semibold">User Management</div>
        <div class="card-body">
          <label class="form-label">Name</label>
          <div class="input-group mb-3">
            <input id="newUserName" class="form-control" placeholder="e.g., Maria Santos">
            <button class="btn btn-primary" id="addUserBtn"><i class="fa-solid fa-user-plus"></i></button>
          </div>
          <label class="form-label">Remove User</label>
          <select id="removeUser" class="form-select mb-2"></select>
          <button class="btn btn-outline-danger w-100" id="removeUserBtn">Remove User</button>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-header fw-semibold">Friendship Management</div>
        <div class="card-body">
          <label class="form-label">User 1</label>
          <select id="friendA" class="form-select mb-2"></select>
          <label class="form-label">User 2</label>
          <select id="friendB" class="form-select mb-3"></select>
          <div class="d-grid gap-2">
            <button class="btn btn-success" id="addFriendBtn"><i class="fa-solid fa-link me-1"></i>Add Friendship</button>
            <button class="btn btn-outline-danger" id="removeFriendBtn"><i class="fa-solid fa-link-slash me-1"></i>Remove Friendship</button>
          </div>
        </div>
      </div>
    </div>

    <div class="col-xl-6">
      <div class="card shadow-sm h-100">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span class="fw-semibold">Live Dynamic Graph</span>
          <button class="btn btn-sm btn-outline-primary" id="fitGraphBtn"><i class="fa-solid fa-expand"></i> Fit</button>
        </div>
        <div class="card-body p-2"><div id="network"></div></div>
      </div>
    </div>

    <div class="col-xl-3">
      <div class="card shadow-sm mb-3">
        <div class="card-header fw-semibold">Graph Analysis</div>
        <div class="card-body">
          <label class="form-label">Person A</label>
          <select id="analysisA" class="form-select mb-2"></select>
          <label class="form-label">Person B</label>
          <select id="analysisB" class="form-select mb-3"></select>
          <div class="d-grid gap-2">
            <button class="btn btn-primary" id="pathBtn">Shortest Connection (BFS)</button>
            <button class="btn btn-outline-primary" id="mutualBtn">Mutual Friends</button>
            <button class="btn btn-outline-secondary" id="groupsBtn">Connected Groups</button>
          </div>
        </div>
      </div>
      <div class="card shadow-sm">
        <div class="card-header fw-semibold">Analysis Result</div>
        <div class="card-body"><div id="result" class="text-muted">Choose an analysis to begin.</div></div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
